<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eye</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* mouse */
const mouse = { x: w / 2, y: h / 2 };
window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function drawEye() {
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  const eyeW = 420;
  const eyeH = 95;
  const circleR = 92;

  ctx.strokeStyle = "#fff";
  ctx.fillStyle = "#fff";

  /* === main almond === */
  ctx.save();
  ctx.lineWidth = 4;
  ctx.shadowBlur = 30;
  ctx.shadowColor = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.moveTo(cx - eyeW / 2, cy);
  ctx.quadraticCurveTo(cx, cy - eyeH, cx + eyeW / 2, cy);
  ctx.quadraticCurveTo(cx, cy + eyeH, cx - eyeW / 2, cy);
  ctx.stroke();
  ctx.restore();

  /* === upper lid (close, hugging) === */
  ctx.save();
  ctx.lineWidth = 3;
  ctx.shadowBlur = 24;
  ctx.shadowColor = "rgba(255,255,255,0.75)";
  ctx.beginPath();
  ctx.moveTo(cx - eyeW / 2 + 30, cy - eyeH + 12);
  ctx.quadraticCurveTo(
    cx,
    cy - eyeH - 8,
    cx + eyeW / 2 - 30,
    cy - eyeH + 12
  );
  ctx.stroke();
  ctx.restore();

  /* === central circle (intersecting) === */
  ctx.save();
  ctx.lineWidth = 4;
  ctx.shadowBlur = 28;
  ctx.shadowColor = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.arc(cx, cy, circleR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  /* === subtle pupil offset === */
  const dx = mouse.x - cx;
  const dy = mouse.y - cy;
  const d = Math.hypot(dx, dy);
  const offset = 14;

  const px = cx + (dx / (d || 1)) * Math.min(d, offset);
  const py = cy + (dy / (d || 1)) * Math.min(d, offset);

  /* === LARGE inner orb === */
  ctx.save();
  ctx.beginPath();
  ctx.arc(px, py, 34, 0, Math.PI * 2);
  ctx.shadowBlur = 35;
  ctx.shadowColor = "rgba(255,255,255,1)";
  ctx.fill();
  ctx.restore();

  /* === simple tear stroke === */
  ctx.save();
  ctx.lineWidth = 3;
  ctx.shadowBlur = 24;
  ctx.shadowColor = "rgba(255,255,255,0.8)";
  ctx.beginPath();
  ctx.moveTo(cx + 6, cy + circleR - 4);
  ctx.quadraticCurveTo(
    cx + 14,
    cy + circleR + 55,
    cx + 2,
    cy + circleR + 95
  );
  ctx.stroke();
  ctx.restore();
}

function animate() {
  drawEye();
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
