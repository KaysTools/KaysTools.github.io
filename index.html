<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Glowing Eye Follow</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        cursor: none;
    }

    svg {
        width: 60vmin;
        height: auto;
        filter: drop-shadow(0 0 12px white)
                drop-shadow(0 0 30px white);
    }

    .glow {
        stroke: white;
        stroke-width: 6;
        fill: none;
        stroke-linecap: round;
    }

    .iris {
        stroke: white;
        stroke-width: 4;
        fill: none;
    }

    .pupil {
        fill: white;
        filter: drop-shadow(0 0 12px white)
                drop-shadow(0 0 25px white);
    }
</style>
</head>
<body>

<svg id="eye" viewBox="0 0 300 150">
    <!-- Upper eyelid -->
    <path class="glow" d="M30 75 Q150 10 270 75" />

    <!-- Lower eyelid -->
    <path class="glow" d="M30 75 Q150 140 270 75" />

    <!-- Iris -->
    <circle class="iris" cx="150" cy="75" r="35" />

    <!-- Pupil -->
    <circle id="pupil" class="pupil" cx="150" cy="75" r="10"/>

    <!-- Tear symbol -->
    <path class="glow" d="M120 95 Q110 115 130 125 Q150 135 145 150" stroke-width="3"/>
</svg>

<script>
const pupil = document.getElementById("pupil");
const eye = document.getElementById("eye");

const eyeCenter = { x: 150, y: 75 };
const maxOffset = 12;

document.addEventListener("mousemove", (e) => {
    const rect = eye.getBoundingClientRect();

    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const scaleX = 300 / rect.width;
    const scaleY = 150 / rect.height;

    const svgX = mouseX * scaleX;
    const svgY = mouseY * scaleY;

    let dx = svgX - eyeCenter.x;
    let dy = svgY - eyeCenter.y;

    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance > maxOffset) {
        dx = (dx / distance) * maxOffset;
        dy = (dy / distance) * maxOffset;
    }

    pupil.setAttribute("cx", eyeCenter.x + dx);
    pupil.setAttribute("cy", eyeCenter.y + dy);
});
</script>

</body>
</html>
