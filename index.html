<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAYTOOLS // OSINT CONSOLE</title>

<!-- =========================================================
     CORE STYLES
========================================================= -->
<style>
/* =======================
   VARIABLES
======================= */
:root {
  --bg-main: #030303;
  --bg-panel: rgba(14, 6, 6, 0.92);
  --bg-soft: rgba(255,255,255,0.03);

  --accent-main: #8b0000;
  --accent-glow: rgba(139,0,0,0.65);
  --accent-soft: rgba(139,0,0,0.25);

  --text-main: #ffffff;
  --text-muted: #bfaeae;
  --text-dim: #8c7a7a;

  --border-soft: rgba(255,255,255,0.08);
  --border-hard: rgba(255,255,255,0.15);

  --good: #1f7a1f;
  --warn: #7a5a1f;
  --bad: #7a1f1f;
}

/* =======================
   RESET
======================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(139,0,0,0.18), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(139,0,0,0.12), transparent 45%),
    var(--bg-main);
  color: var(--text-main);
}

/* =========================================================
   HEADER
========================================================= */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 48px;
  border-bottom: 1px solid var(--border-soft);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  font-weight: 600;
  letter-spacing: 1px;
}

.brand-badge {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #a00000, #400000);
  box-shadow: 0 0 22px var(--accent-glow);
}

nav a {
  margin-left: 26px;
  text-decoration: none;
  font-size: 13px;
  color: var(--text-muted);
}

nav a:hover {
  color: var(--text-main);
}

/* =========================================================
   MAIN LAYOUT
========================================================= */
main {
  padding: 80px 20px 140px;
  text-align: center;
}

h1 {
  font-size: 44px;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: 14px;
  color: var(--text-muted);
  font-size: 15px;
}

/* =========================================================
   SEARCH PANEL
========================================================= */
.search-panel {
  max-width: 960px;
  margin: 70px auto 0;
  background: var(--bg-panel);
  border-radius: 24px;
  padding: 30px;
  border: 1px solid var(--border-soft);
  box-shadow: 0 0 60px rgba(139,0,0,0.35);
  position: relative;
  overflow: hidden;
}

/* SCAN LINE */
.scan-line {
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-main), transparent);
  animation: scan 4s infinite linear;
}

@keyframes scan {
  to { left: 100%; }
}

/* SEARCH ROW */
.search-row {
  display: flex;
  gap: 14px;
}

/* =========================================================
   CUSTOM PICKER
========================================================= */
.picker {
  position: relative;
  width: 180px;
}

.picker-display {
  padding: 14px;
  border-radius: 14px;
  background: rgba(0,0,0,0.65);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  text-align: left;
}

.picker-options {
  position: absolute;
  top: 110%;
  left: 0;
  right: 0;
  background: rgba(8,0,0,0.95);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  display: none;
  z-index: 20;
}

.picker-options.open {
  display: block;
}

.picker-options div {
  padding: 12px 14px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-muted);
}

.picker-options div:hover {
  background: var(--accent-soft);
  color: var(--text-main);
}

/* =========================================================
   INPUT + BUTTON
========================================================= */
.search-row input {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--border-soft);
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 14px;
}

.search-row button {
  padding: 14px 30px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #a00000, #500000);
  color: white;
  cursor: pointer;
  box-shadow: 0 0 30px var(--accent-glow);
}

/* =========================================================
   RESULTS
========================================================= */
.results {
  max-width: 960px;
  margin: 40px auto 0;
  text-align: left;
  display: none;
}

.result-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  margin-bottom: 10px;
}

.badge.good { background: rgba(31,122,31,0.35); }
.badge.warn { background: rgba(122,90,31,0.35); }
.badge.bad  { background: rgba(122,31,31,0.45); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 14px;
}

.grid div {
  font-size: 13px;
  color: var(--text-muted);
}

/* =========================================================
   FOOTER NOTE
========================================================= */
.disclaimer {
  margin-top: 14px;
  font-size: 12px;
  color: var(--text-dim);
}

/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 720px) {
  .search-row { flex-direction: column; }
  h1 { font-size: 34px; }
}
</style>

<!-- =========================================================
     SCRIPT
========================================================= -->
<script>
/* =========================================================
   STATE
========================================================= */
let currentType = "ip";

/* =========================================================
   VALIDATION PATTERNS
========================================================= */
const validators = {
  ip: /^(25[0-5]|2[0-4]\d|[01]?\d\d?)\.(25[0-5]|2[0-4]\d|[01]?\d\d?)\.(25[0-5]|2[0-4]\d|[01]?\d\d?)\.(25[0-5]|2[0-4]\d|[01]?\d\d?)$/,
  domain: /^(?!:\/\/)([a-zA-Z0-9-_]+\.)+[a-zA-Z]{2,}$/,
  email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
  username: /^[a-zA-Z0-9_]{3,32}$/
};

/* =========================================================
   PICKER LOGIC
========================================================= */
function togglePicker() {
  document.getElementById("pickerOptions").classList.toggle("open");
}

function setType(type, label) {
  currentType = type;
  document.getElementById("pickerDisplay").innerText = label;
  document.getElementById("pickerOptions").classList.remove("open");
}

/* =========================================================
   SEARCH LOGIC
========================================================= */
function runSearch() {
  const query = document.getElementById("query").value.trim();
  const results = document.getElementById("results");
  const out = document.getElementById("output");

  results.style.display = "block";
  out.innerHTML = "";

  if (!validators[currentType].test(query)) {
    out.innerHTML = `
      <div class="result-card">
        <span class="badge warn">Invalid Input</span>
        <p>The value does not match the expected format for a ${currentType} investigation.</p>
      </div>`;
    return;
  }

  if (currentType === "ip") {
    out.innerHTML = `
      <div class="result-card">
        <span class="badge good">Valid IP Identified</span>
        <div class="grid">
          <div>IP Address: ${query}</div>
          <div>Public Metadata: Available</div>
          <div>Geolocation: Not resolved (frontend)</div>
          <div>ASN: Not resolved</div>
        </div>
        <div class="disclaimer">Infrastructure data requires authenticated APIs.</div>
      </div>`;
  }

  if (currentType === "domain") {
    out.innerHTML = `
      <div class="result-card">
        <span class="badge warn">Domain Detected</span>
        <div class="grid">
          <div>Domain: ${query}</div>
          <div>DNS Presence: Likely</div>
          <div>Reputation: Unknown</div>
          <div>SSL Status: Not evaluated</div>
        </div>
      </div>`;
  }

  if (currentType === "email" || currentType === "username") {
    out.innerHTML = `
      <div class="result-card">
        <span class="badge bad">Potential Exposure Surface</span>
        <div class="grid">
          <div>Target: ${query}</div>
          <div>Public Breach Indexing: Possible</div>
          <div>Exposed Fields: Emails, Password Hashes</div>
          <div>Confidence: Medium</div>
        </div>
        <div class="disclaimer">
          Breach confirmation requires authenticated data sources.
        </div>
      </div>`;
  }
}

/* =========================================================
   CLICK OUTSIDE HANDLER
========================================================= */
document.addEventListener("click", e => {
  if (!e.target.closest(".picker")) {
    document.getElementById("pickerOptions").classList.remove("open");
  }
});
</script>
</head>

<body>

<header>
  <div class="brand">
    <div class="brand-badge"></div>
    <span>KAYTOOLS</span>
  </div>
  <nav>
    <a href="#">Console</a>
    <a href="#">Modules</a>
    <a href="#">Docs</a>
  </nav>
</header>

<main>
  <h1>Open Source Intelligence Console</h1>
  <p class="subtitle">Public data correlation and exposure analysis</p>

  <section class="search-panel">
    <div class="scan-line"></div>
    <div class="search-row">
      <div class="picker">
        <div class="picker-display" id="pickerDisplay" onclick="togglePicker()">IP Address</div>
        <div class="picker-options" id="pickerOptions">
          <div onclick="setType('ip','IP Address')">IP Address</div>
          <div onclick="setType('domain','Domain')">Domain</div>
          <div onclick="setType('email','Email')">Email</div>
          <div onclick="setType('username','Username')">Username</div>
        </div>
      </div>
      <input id="query" placeholder="Enter target value" />
      <button onclick="runSearch()">Investigate</button>
    </div>
  </section>

  <section class="results" id="results">
    <div id="output"></div>
  </section>
</main>

</body>
</html>
