<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            color: #212529;
            overflow: hidden;
            position: relative;
        }
        h1 {
            margin-top: 50px;
            font-size: 4rem;
            letter-spacing: 4px;
            text-align: center;
            color: #343a40;
            font-weight: 700;
            z-index: 2;
        }
        /* Eye - unchanged, still follows cursor */
        .eye-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
            z-index: 2;
        }
        .eyeball {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5),
                        inset 0 0 80px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .iris {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #a82828, #742424);
            border-radius: 50%;
            top: 70px;
            left: 70px;
            transition: transform 0.1s ease-out;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
        }
        .pupil {
            position: absolute;
            width: 56px;
            height: 56px;
            background: black;
            border-radius: 50%;
            top: 42px;
            left: 42px;
            box-shadow: 0 0 20px rgba(116, 36, 36, 0.9);
        }
        .glare {
            position: absolute;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            top: 18px;
            left: 18px;
            opacity: 0.8;
        }
        /* Search area - clean, modern, professional */
        .search-container {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 60px;
            z-index: 2;
            text-align: center;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }
        .option-btn {
            padding: 12px 28px;
            font-size: 1.1rem;
            background: #f1f3f5;
            color: #495057;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .option-btn:hover, .option-btn.active {
            background: #343a40;
            color: white;
        }
        .search-input-area {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        input[type="text"] {
            padding: 16px 24px;
            width: 500px;
            max-width: 100%;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            color: #212529;
            font-size: 1.2rem;
            transition: border 0.3s ease;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #495057;
            box-shadow: 0 0 0 4px rgba(52, 58, 64, 0.1);
        }
        input[type="text"]::placeholder {
            color: #868e96;
        }
        .go-btn {
            padding: 16px 40px;
            font-size: 1.4rem;
            background: #343a40;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .go-btn:hover {
            background: #212529;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>iSpy</h1>
    <!-- Eye follows your cursor (unchanged) -->
    <div class="eye-container" id="eyeContainer">
        <div class="eyeball">
            <div class="iris" id="iris">
                <div class="pupil">
                    <div class="glare"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Search panel always visible -->
    <div class="search-container">
        <div class="options">
            <button class="option-btn active">Discord ID</button>
            <button class="option-btn">Username</button>
            <button class="option-btn">IP Lookup</button>
            <button class="option-btn">Website</button>
            <button class="option-btn">User on Site</button>
        </div>
        <div class="search-input-area">
            <input type="text" id="searchInput" placeholder="Enter target...">
            <button class="go-btn">Search →</button>
        </div>
    </div>
    <script>
        // Eye follows cursor (unchanged)
        const eyeContainer = document.getElementById('eyeContainer');
        const iris = document.getElementById('iris');
        document.addEventListener('mousemove', (e) => {
            const rect = eyeContainer.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;
            const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
            const distance = Math.min(42, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 10);
            const offsetX = Math.cos(angle) * distance;
            const offsetY = Math.sin(angle) * distance;
            iris.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });
        // Option buttons - clickable highlight (updated placeholder text)
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // Change placeholder based on selected option
                const placeholders = {
                    'Discord ID': 'e.g. 123456789012345678',
                    'Username': 'e.g. winterfox',
                    'IP Lookup': 'e.g. 192.168.1.1',
                    'Website': 'e.g. example.com',
                    'User on Site': 'e.g. reddit.com/u/username'
                };
                document.getElementById('searchInput').placeholder = placeholders[btn.textContent] || 'Enter target...';
            });
        });
    </script>
</body>
</html>
