<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpy</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: 'Creepster', cursive;
            color: #ff0000;
            overflow: hidden;
            position: relative;
        }

        /* Subtle pulsing red waves in background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-radial-gradient(
                circle at center,
                transparent 0%,
                #110000 30%,
                #220000 50%,
                transparent 70%
            );
            background-size: 300% 300%;
            animation: pulse 15s ease-in-out infinite alternate;
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulse {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Bloody title */
        h1 {
            margin-top: 50px;
            font-size: 6rem;
            letter-spacing: 12px;
            text-align: center;
            color: #ff0000;
            text-shadow: 
                0 0 20px #ff0000,
                0 0 40px #aa0000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                3px 3px 0 #000;
            z-index: 2;
        }

        /* Eye - unchanged, still follows cursor */
        .eye-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
            z-index: 2;
        }

        .eyeball {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5),
                        inset 0 0 80px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .iris {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #a82828, #742424);
            border-radius: 50%;
            top: 70px;
            left: 70px;
            transition: transform 0.1s ease-out;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .pupil {
            position: absolute;
            width: 56px;
            height: 56px;
            background: black;
            border-radius: 50%;
            top: 42px;
            left: 42px;
            box-shadow: 0 0 20px rgba(116, 36, 36, 0.9);
        }

        .glare {
            position: absolute;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            top: 18px;
            left: 18px;
            opacity: 0.8;
        }

        /* Search area - now always visible, no reveal button */
        .search-container {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 60px;
            z-index: 2;
            text-align: center;
            background: rgba(20, 0, 0, 0.7);
            border: 3px solid #ff0000;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .option-btn {
            padding: 15px 35px;
            font-family: 'Creepster', cursive;
            font-size: 1.8rem;
            background: #000;
            color: #ff0000;
            border: 3px solid #ff0000;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff0000;
            transition: all 0.3s;
        }

        .option-btn:hover, .option-btn.active {
            background: #ff0000;
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 0 40px #ff0000;
        }

        .search-input-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 20px 30px;
            width: 400px;
            max-width: 100%;
            background: #000;
            border: 3px solid #ff0000;
            border-radius: 50px;
            color: #ff0000;
            font-family: 'Creepster', cursive;
            font-size: 2rem;
            text-align: center;
            box-shadow: 0 0 20px #ff0000;
        }

        input[type="text"]::placeholder {
            color: #880000;
        }

        .go-btn {
            padding: 20px 50px;
            font-family: 'Creepster', cursive;
            font-size: 2.5rem;
            background: #ff0000;
            color: #000;
            border: 4px solid #000;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 40px #ff0000;
            transition: all 0.3s;
        }

        .go-btn:hover {
            transform: scale(1.15);
            background: #ff3333;
            box-shadow: 0 0 60px #ff0000;
        }
    </style>
</head>
<body>

    <h1>iSpy</h1>

    <!-- Eye follows your cursor -->
    <div class="eye-container" id="eyeContainer">
        <div class="eyeball">
            <div class="iris" id="iris">
                <div class="pupil">
                    <div class="glare"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search panel always visible -->
    <div class="search-container">
        <div class="options">
            <button class="option-btn active">Discord ID</button>
            <button class="option-btn">Username</button>
            <button class="option-btn">IP Lookup</button>
            <button class="option-btn">Website</button>
            <button class="option-btn">User on Site</button>
        </div>

        <div class="search-input-area">
            <input type="text" id="searchInput" placeholder="Enter target...">
            <button class="go-btn">GO →</button>
        </div>
    </div>

    <script>
        // Eye follows cursor
        const eyeContainer = document.getElementById('eyeContainer');
        const iris = document.getElementById('iris');

        document.addEventListener('mousemove', (e) => {
            const rect = eyeContainer.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;

            const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
            const distance = Math.min(42, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 10);

            const offsetX = Math.cos(angle) * distance;
            const offsetY = Math.sin(angle) * distance;

            iris.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });

        // Option buttons - clickable highlight
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Change placeholder based on selected option
                const placeholders = {
                    'Discord ID': 'e.g. 123456789012345678',
                    'Username': 'e.g. winterfox',
                    'IP Lookup': 'e.g. 192.168.1.1',
                    'Website': 'e.g. example.com',
                    'User on Site': 'e.g. reddit.com/u/username'
                };
                document.getElementById('searchInput').placeholder = placeholders[btn.textContent] || 'Enter target...';
            });
        });
    </script>
</body>
</html>
