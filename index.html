<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpy</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: repeating-linear-gradient(
                45deg,
                #000000,
                #000000 20px,
                #8B0000 20px,
                #8B0000 40px,
                #330000 40px,
                #330000 60px,
                #660000 60px,
                #660000 80px,
                #AA0000 80px,
                #AA0000 100px,
                #000000 100px,
                #000000 120px,
                #8B0000 120px,
                #8B0000 140px
            );
            background-size: 200% 200%;
            animation: wave 20s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            color: white;
            overflow: hidden;
        }

        @keyframes wave {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Title */
        h1 {
            margin-top: 40px;
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #cccccc, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
            letter-spacing: 8px;
        }

        /* Bigger eye */
        .eye-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
        }

        .eyeball {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5),
                        inset 0 0 80px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .iris {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #a82828, #742424);
            border-radius: 50%;
            top: 70px;
            left: 70px;
            transition: transform 0.1s ease-out;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .pupil {
            position: absolute;
            width: 56px;
            height: 56px;
            background: black;
            border-radius: 50%;
            top: 42px;
            left: 42px;
            box-shadow: 0 0 20px rgba(116, 36, 36, 0.9);
        }

        .glare {
            position: absolute;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            top: 18px;
            left: 18px;
            opacity: 0.8;
        }

        /* Search section - hidden by default */
        .search-section {
            width: 90%;
            max-width: 900px;
            margin-bottom: 50px;
            text-align: center;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.8s ease-out, opacity 0.8s ease-out;
            opacity: 0;
        }

        .search-section.open {
            max-height: 400px;
            opacity: 1;
        }

        /* Select button */
        .select-btn {
            padding: 16px 40px;
            background: linear-gradient(to bottom, #aa0000, #660000);
            border: 3px solid #000;
            border-radius: 40px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            transition: all 0.3s;
            margin: 20px 0;
            text-shadow: 
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }

        .select-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255, 0, 0, 1);
        }

        /* Selector buttons */
        .selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .selector button {
            padding: 14px 28px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #aa0000;
            border-radius: 30px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }

        .selector button:hover, .selector button.active {
            background: #aa0000;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        select, input {
            padding: 18px 25px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #aa0000;
            border-radius: 40px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            min-width: 250px;
            text-shadow: 
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }

        input::placeholder {
            color: #aaaaaa;
        }

        button.search-btn {
            padding: 18px 40px;
            background: linear-gradient(to bottom, #ff2222, #aa0000);
            border: 3px solid #000;
            border-radius: 40px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
            transition: all 0.3s;
            text-shadow: 
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
        }

        button.search-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(255, 0, 0, 1);
        }
    </style>
</head>
<body>

    <h1>iSpy</h1>

    <!-- Bigger eye that follows cursor -->
    <div class="eye-container" id="eyeContainer">
        <div class="eyeball">
            <div class="iris" id="iris">
                <div class="pupil">
                    <div class="glare"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Big SELECT button -->
    <button class="select-btn" id="selectBtn">SELECT</button>

    <!-- Search section - slides down when SELECT is clicked -->
    <div class="search-section" id="searchSection">
        <div class="selector">
            <button class="active">Discord ID</button>
            <button>Username</button>
            <button>IP Lookup</button>
            <button>Website</button>
            <button>User on Site</button>
        </div>

        <div class="search-bar">
            <select id="searchType">
                <option value="discord-id">Discord ID</option>
                <option value="username">Username</option>
                <option value="ip">IP Lookup</option>
                <option value="website">Website</option>
                <option value="site-user">User on Site</option>
            </select>
            <input type="text" id="searchInput" placeholder="Enter value here...">
            <button class="search-btn">Search →</button>
        </div>
    </div>

    <script>
        // Eye follows cursor
        const eyeContainer = document.getElementById('eyeContainer');
        const iris = document.getElementById('iris');

        document.addEventListener('mousemove', (e) => {
            const rect = eyeContainer.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;

            const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
            const distance = Math.min(42, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 10);

            const offsetX = Math.cos(angle) * distance;
            const offsetY = Math.sin(angle) * distance;

            iris.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });

        // Toggle search section
        const selectBtn = document.getElementById('selectBtn');
        const searchSection = document.getElementById('searchSection');

        selectBtn.addEventListener('click', () => {
            searchSection.classList.toggle('open');
        });

        // Dynamic placeholder
        const searchType = document.getElementById('searchType');
        const searchInput = document.getElementById('searchInput');

        const placeholders = {
            'discord-id': 'e.g. 123456789012345678',
            'username': 'e.g. winterfox',
            'ip': 'e.g. 192.168.1.1',
            'website': 'e.g. example.com',
            'site-user': 'e.g. reddit.com/u/username'
        };

        searchType.addEventListener('change', () => {
            searchInput.placeholder = placeholders[searchType.value] || 'Enter value here...';
        });

        // Make selector buttons clickable
        document.querySelectorAll('.selector button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.selector button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Optional: sync with dropdown
                const type = btn.textContent.toLowerCase().replace(' ', '-');
                if (searchType.querySelector(`option[value="${type}"]`)) {
                    searchType.value = type;
                    searchInput.placeholder = placeholders[type] || 'Enter value here...';
                }
            });
        });
    </script>
</body>
</html>
