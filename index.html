<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eye</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* mouse */
const mouse = { x: w / 2, y: h / 2 };
window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function drawEye() {
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  const eyeW = 440;
  const eyeH = 85;
  const circleR = 115;
  const orbR = 42;

  ctx.strokeStyle = "#fff";
  ctx.fillStyle = "#fff";

  /* === long, flat upper line === */
  ctx.save();
  ctx.lineWidth = 3;
  ctx.shadowBlur = 24;
  ctx.shadowColor = "rgba(255,255,255,0.8)";
  ctx.beginPath();
  ctx.moveTo(cx - eyeW / 2 - 20, cy - circleR - 18);
  ctx.quadraticCurveTo(
    cx,
    cy - circleR - 30,
    cx + eyeW / 2 + 20,
    cy - circleR - 18
  );
  ctx.stroke();
  ctx.restore();

  /* === central circle === */
  ctx.save();
  ctx.lineWidth = 4;
  ctx.shadowBlur = 30;
  ctx.shadowColor = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.arc(cx, cy, circleR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  /* === eye almond (intersecting circle) === */
  ctx.save();
  ctx.lineWidth = 4;
  ctx.shadowBlur = 30;
  ctx.shadowColor = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.moveTo(cx - eyeW / 2, cy);
  ctx.quadraticCurveTo(cx, cy - eyeH, cx + eyeW / 2, cy);
  ctx.quadraticCurveTo(cx, cy + eyeH, cx - eyeW / 2, cy);
  ctx.stroke();
  ctx.restore();

  /* === subtle orb tracking === */
  const dx = mouse.x - cx;
  const dy = mouse.y - cy;
  const d = Math.hypot(dx, dy);
  const maxOffset = 12;

  const px = cx + (dx / (d || 1)) * Math.min(d, maxOffset);
  const py = cy + (dy / (d || 1)) * Math.min(d, maxOffset);

  /* === MASSIVE inner orb === */
  ctx.save();
  ctx.beginPath();
  ctx.arc(px, py, orbR, 0, Math.PI * 2);
  ctx.shadowBlur = 40;
  ctx.shadowColor = "rgba(255,255,255,1)";
  ctx.fill();
  ctx.restore();

  /* === minimal tear === */
  ctx.save();
  ctx.lineWidth = 3;
  ctx.shadowBlur = 22;
  ctx.shadowColor = "rgba(255,255,255,0.8)";
  ctx.beginPath();
  ctx.moveTo(cx + 2, cy + circleR - 5);
  ctx.quadraticCurveTo(
    cx + 6,
    cy + circleR + 60,
    cx + 2,
    cy + circleR + 110
  );
  ctx.stroke();
  ctx.restore();
}

function animate() {
  drawEye();
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
