<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }

        /* Void black background with subtle dark red particles */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 80%, rgba(100, 0, 0, 0.15) 0%, transparent 20%),
                        radial-gradient(circle at 80% 20%, rgba(120, 0, 0, 0.1) 0%, transparent 25%),
                        radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.12) 0%, transparent 30%);
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle, rgba(150, 0, 0, 0.4) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.07;
            animation: drift 40s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes drift {
            0% { background-position: 0 0, 30px 30px; }
            100% { background-position: 60px 60px, 90px 90px; }
        }

        h1 {
            margin-top: 60px;
            font-size: 4.5rem;
            letter-spacing: 6px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(200, 0, 0, 0.4);
            z-index: 2;
        }

        /* Eye - unchanged */
        .eye-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
            z-index: 2;
        }
        .eyeball {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5),
                        inset 0 0 80px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .iris {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #a82828, #742424);
            border-radius: 50%;
            top: 70px;
            left: 70px;
            transition: transform 0.1s ease-out;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
        }
        .pupil {
            position: absolute;
            width: 56px;
            height: 56px;
            background: black;
            border-radius: 50%;
            top: 42px;
            left: 42px;
            box-shadow: 0 0 20px rgba(116, 36, 36, 0.9);
        }
        .glare {
            position: absolute;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            top: 18px;
            left: 18px;
            opacity: 0.8;
        }

        /* Main search container - glassmorphism style */
        .search-container {
            width: 90%;
            max-width: 1100px;
            margin-bottom: 80px;
            z-index: 2;
            background: rgba(20, 10, 15, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(150, 20, 40, 0.2);
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6),
                        inset 0 0 40px rgba(80, 0, 0, 0.1);
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .option-btn {
            padding: 12px 32px;
            font-size: 1.1rem;
            background: rgba(40, 20, 30, 0.4);
            color: #d0d0d0;
            border: 1px solid rgba(180, 30, 50, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .option-btn:hover {
            background: rgba(80, 20, 40, 0.6);
            border-color: rgba(220, 40, 60, 0.5);
        }

        .option-btn.active {
            background: rgba(150, 20, 40, 0.7);
            color: #ffffff;
            border-color: #c02030;
            box-shadow: 0 0 20px rgba(200, 30, 50, 0.4);
        }

        .search-input-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 360px;
            padding: 20px 28px;
            background: rgba(15, 5, 10, 0.5);
            border: 1px solid rgba(180, 30, 50, 0.4);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1.3rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #c02030;
            box-shadow: 0 0 25px rgba(200, 30, 50, 0.3);
            background: rgba(25, 10, 15, 0.6);
        }

        input[type="text"]::placeholder {
            color: #888888;
        }

        .go-btn {
            padding: 20px 48px;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #a02030, #801020);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(160, 20, 40, 0.4);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .go-btn:hover {
            background: linear-gradient(135deg, #c02030, #a01020);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(200, 30, 50, 0.5);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            color: #b0b0b0;
        }

        .feature-icon {
            font-size: 1.2rem;
            color: #c04050;
        }
    </style>
</head>
<body>
    <h1>iSpy</h1>

    <!-- Eye follows cursor (unchanged) -->
    <div class="eye-container" id="eyeContainer">
        <div class="eyeball">
            <div class="iris" id="iris">
                <div class="pupil">
                    <div class="glare"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="search-container">
        <div class="options">
            <button class="option-btn active">Discord ID</button>
            <button class="option-btn">Username</button>
            <button class="option-btn">IP Lookup</button>
            <button class="option-btn">Website</button>
            <button class="option-btn">User on Site</button>
        </div>

        <div class="search-input-area">
            <input type="text" id="searchInput" placeholder="e.g. domain: example.org">
            <button class="go-btn">Search →</button>
        </div>

        <div class="features">
            <div class="feature"><span class="feature-icon">⚡</span> Automated</div>
            <div class="feature"><span class="feature-icon">🔍</span> Manual</div>
            <div class="feature"><span class="feature-icon">📑</span> Bulk Search</div>
            <div class="feature"><span class="feature-icon">🔒</span> Secure Search</div>
            <div class="feature"><span class="feature-icon">🌐</span> 15+ Sources</div>
        </div>
    </div>

    <script>
        // Eye follows cursor
        const eyeContainer = document.getElementById('eyeContainer');
        const iris = document.getElementById('iris');
        document.addEventListener('mousemove', (e) => {
            const rect = eyeContainer.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;
            const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
            const distance = Math.min(42, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 10);
            const offsetX = Math.cos(angle) * distance;
            const offsetY = Math.sin(angle) * distance;
            iris.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });

        // Option buttons
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const placeholders = {
                    'Discord ID': 'e.g. 123456789012345678',
                    'Username': 'e.g. winterfox',
                    'IP Lookup': 'e.g. 192.168.1.1',
                    'Website': 'e.g. example.com',
                    'User on Site': 'e.g. reddit.com/u/username'
                };
                document.getElementById('searchInput').placeholder = placeholders[btn.textContent] || 'e.g. domain: example.org';
            });
        });
    </script>
</body>
</html>
