<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Network</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0d10;
      overflow: hidden;
      cursor: none; /* hide system cursor */
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* ---------------- Cursor ---------------- */

const mouse = {
  x: null,
  y: null,
  tx: null,
  ty: null,
  down: false
};

window.addEventListener("mousemove", e => {
  mouse.tx = e.clientX;
  mouse.ty = e.clientY;

  if (mouse.x === null) {
    mouse.x = mouse.tx;
    mouse.y = mouse.ty;
  }
});

window.addEventListener("mousedown", () => mouse.down = true);
window.addEventListener("mouseup", () => mouse.down = false);
window.addEventListener("mouseleave", () => {
  mouse.x = mouse.y = mouse.tx = mouse.ty = null;
  mouse.down = false;
});

/* smooth cursor follow */
function updateCursor() {
  if (mouse.tx !== null) {
    mouse.x += (mouse.tx - mouse.x) * 0.25;
    mouse.y += (mouse.ty - mouse.y) * 0.25;
  }
}

/* ---------------- Network ---------------- */

const NODE_COUNT = 140;
const BASE_DISTANCE = 130;
const GRAB_RADIUS = 160;

const nodes = [];

class Node {
  constructor() {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.r = 1.2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0 || this.x > w) this.vx *= -1;
    if (this.y < 0 || this.y > h) this.vy *= -1;

    if (mouse.x !== null) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.hypot(dx, dy);

      if (dist < GRAB_RADIUS) {
        const force = mouse.down ? 0.02 : 0.007;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    this.vx *= 0.98;
    this.vy *= 0.98;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = "#f5f5f5";
    ctx.fill();
  }
}

function drawConnections() {
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const dist = Math.hypot(dx, dy);

      let maxDist = BASE_DISTANCE;

      if (mouse.x !== null) {
        const mx = (nodes[i].x + nodes[j].x) / 2 - mouse.x;
        const my = (nodes[i].y + nodes[j].y) / 2 - mouse.y;
        if (Math.hypot(mx, my) < GRAB_RADIUS) maxDist += 60;
      }

      if (dist < maxDist) {
        const a = 1 - dist / maxDist;
        ctx.strokeStyle = `rgba(255,255,255,${a * 0.35})`;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }
}

/* ---------------- Cursor Draw ---------------- */

function drawCursor() {
  if (mouse.x === null) return;

  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  ctx.lineWidth = 1;
  ctx.strokeStyle = "#000000";
  ctx.stroke();
}

/* ---------------- Animate ---------------- */

function animate() {
  ctx.clearRect(0, 0, w, h);

  updateCursor();

  nodes.forEach(n => {
    n.update();
    n.draw();
  });

  drawConnections();
  drawCursor();

  requestAnimationFrame(animate);
}

/* init */
for (let i = 0; i < NODE_COUNT; i++) {
  nodes.push(new Node());
}
animate();
</script>

</body>
</html>
