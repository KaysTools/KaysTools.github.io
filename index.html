<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpyWithMyLittleEye</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000; /* Dark GD-style background */
            overflow: hidden;
            cursor: default; /* Show normal cursor again */
        }

        .eye-container {
            position: relative;
            width: 300px;  /* Smaller eye */
            height: 300px;
        }

        .eyeball {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.6),
                        inset 0 0 80px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .iris {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #00aaff, #0066cc);
            border-radius: 50%;
            top: 75px;
            left: 75px;
            transition: transform 0.1s ease-out;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5);
        }

        .pupil {
            position: absolute;
            width: 60px;
            height: 60px;
            background: black;
            border-radius: 50%;
            top: 45px;
            left: 45px;
            box-shadow: 0 0 15px rgba(0, 0, 255, 0.8);
        }

        .glare {
            position: absolute;
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            top: 20px;
            left: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="eye-container" id="eyeContainer">
        <div class="eyeball">
            <div class="iris" id="iris">
                <div class="pupil">
                    <div class="glare"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const eyeContainer = document.getElementById('eyeContainer');
        const iris = document.getElementById('iris');

        document.addEventListener('mousemove', (e) => {
            const rect = eyeContainer.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;

            const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
            const distance = Math.min(45, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 10); // Adjusted limit for smaller eye

            const offsetX = Math.cos(angle) * distance;
            const offsetY = Math.sin(angle) * distance;

            iris.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });
    </script>
</body>
</html>
