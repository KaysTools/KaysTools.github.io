<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watching Eye</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    cursor: none;
}
svg {
    width: 70vmin;
}
</style>
</head>
<body>

<svg id="eyeSVG" viewBox="0 0 600 300">

<defs>
    <!-- Strong soft bloom -->
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="8" result="blur1"/>
        <feGaussianBlur stdDeviation="20" result="blur2"/>
        <feMerge>
            <feMergeNode in="blur2"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Foggy iris glow -->
    <filter id="fog">
        <feGaussianBlur stdDeviation="25"/>
    </filter>
</defs>

<!-- Eye outline -->
<g filter="url(#bloom)">
    <!-- Upper lid -->
    <path d="M60 150 Q300 70 540 150"
          fill="none"
          stroke="white"
          stroke-width="10"
          stroke-linecap="round"/>

    <!-- Lower lid -->
    <path d="M60 150 Q300 230 540 150"
          fill="none"
          stroke="white"
          stroke-width="10"
          stroke-linecap="round"/>
</g>

<!-- Iris fog -->
<circle cx="300" cy="150" r="70"
        fill="white"
        opacity="0.18"
        filter="url(#fog)"/>

<!-- Tear / sigil -->
<path d="M285 185
         Q260 215 280 245
         Q300 270 295 295"
      fill="none"
      stroke="white"
      stroke-width="6"
      opacity="0.85"
      filter="url(#bloom)"
      stroke-linecap="round"/>

<!-- Pupil (mouse-following) -->
<circle id="pupil"
        cx="300"
        cy="150"
        r="14"
        fill="white"
        filter="url(#bloom)"/>

</svg>

<script>
const pupil = document.getElementById("pupil");
const svg = document.getElementById("eyeSVG");

const center = { x: 300, y: 150 };
const maxOffset = 22;

document.addEventListener("mousemove", (e) => {
    const rect = svg.getBoundingClientRect();

    const mx = (e.clientX - rect.left) * (600 / rect.width);
    const my = (e.clientY - rect.top) * (300 / rect.height);

    let dx = mx - center.x;
    let dy = my - center.y;

    const dist = Math.sqrt(dx*dx + dy*dy);
