<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Observer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000000;
      overflow: hidden;
      cursor: default; /* restore normal cursor */
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      background: #000000;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* ---------- Mouse ---------- */

const mouse = { x: w / 2, y: h / 2 };

window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

/* ---------- Network ---------- */

const NODE_COUNT = 120;
const LINK_DISTANCE = 140;

const nodes = [];

class Node {
  constructor() {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.vx = (Math.random() - 0.5) * 0.9;
    this.vy = (Math.random() - 0.5) * 0.9;
    this.r = 1.2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0 || this.x > w) this.vx *= -1;
    if (this.y < 0 || this.y > h) this.vy *= -1;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
  }
}

function drawConnections() {
  ctx.lineWidth = 0.5;
  ctx.shadowBlur = 6;
  ctx.shadowColor = "rgba(255,255,255,0.3)";

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const d = Math.hypot(dx, dy);

      if (d < LINK_DISTANCE) {
        const a = 1 - d / LINK_DISTANCE;
        ctx.strokeStyle = `rgba(255,255,255,${a * 0.25})`;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }

  ctx.shadowBlur = 0;
}

/* ---------- Eye ---------- */

function drawEye() {
  const cx = w / 2;
  const cy = h / 2;

  const eyeRadiusX = 180;
  const eyeRadiusY = 90;

  // glow
  ctx.save();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 40;
  ctx.shadowColor = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.ellipse(cx, cy, eyeRadiusX, eyeRadiusY, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // pupil direction
  const dx = mouse.x - cx;
  const dy = mouse.y - cy;
  const angle = Math.atan2(dy, dx);

  const maxOffset = 35;
  const px = cx + Math.cos(angle) * maxOffset;
  const py = cy + Math.sin(angle) * maxOffset;

  // pupil
  ctx.save();
  ctx.beginPath();
  ctx.arc(px, py, 16, 0, Math.PI * 2);
  ctx.fillStyle = "#000000";
  ctx.fill();

  ctx.shadowBlur = 25;
  ctx.shadowColor = "rgba(255,255,255,0.8)";
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

/* ---------- Animate ---------- */

function animate() {
  ctx.clearRect(0, 0, w, h);

  nodes.forEach(n => {
    n.update();
    n.draw();
  });

  drawConnections();
  drawEye();

  requestAnimationFrame(animate);
}

/* init */
for (let i = 0; i < NODE_COUNT; i++) {
  nodes.push(new Node());
}
animate();
</script>

</body>
</html>
