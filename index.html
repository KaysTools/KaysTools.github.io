<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eye</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* ---------- Mouse ---------- */
const mouse = { x: w / 2, y: h / 2 };
window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

/* ---------- Eye ---------- */
function drawEye() {
  const cx = w / 2;
  const cy = h / 2;

  const eyeW = 360;
  const eyeH = 160;

  ctx.clearRect(0, 0, w, h);

  /* --- outer eye outline --- */
  ctx.save();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 4;
  ctx.shadowBlur = 40;
  ctx.shadowColor = "rgba(255,255,255,0.9)";

  ctx.beginPath();
  ctx.moveTo(cx - eyeW / 2, cy);
  ctx.quadraticCurveTo(cx, cy - eyeH / 2, cx + eyeW / 2, cy);
  ctx.quadraticCurveTo(cx, cy + eyeH / 2, cx - eyeW / 2, cy);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  /* --- inner iris ring --- */
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, 55, 0, Math.PI * 2);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 25;
  ctx.shadowColor = "rgba(255,255,255,0.7)";
  ctx.stroke();
  ctx.restore();

  /* --- pupil tracking --- */
  const dx = mouse.x - cx;
  const dy = mouse.y - cy;
  const dist = Math.hypot(dx, dy);
  const maxOffset = 20;

  const px = cx + (dx / dist) * Math.min(dist, maxOffset);
  const py = cy + (dy / dist) * Math.min(dist, maxOffset);

  /* --- glowing pupil --- */
  ctx.save();
  ctx.beginPath();
  ctx.arc(px, py, 16, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.shadowBlur = 30;
  ctx.shadowColor = "rgba(255,255,255,1)";
  ctx.fill();
  ctx.restore();

  /* --- tear / flourish (inspired curve) --- */
  ctx.save();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 30;
  ctx.shadowColor = "rgba(255,255,255,0.8)";

  ctx.beginPath();
  ctx.moveTo(cx - 10, cy + 40);
  ctx.bezierCurveTo(
    cx - 50, cy + 90,
    cx + 10, cy + 120,
    cx + 25, cy + 70
  );
  ctx.stroke();
  ctx.restore();
}

/* ---------- Animate ---------- */
function animate() {
  drawEye();
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
