<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OSINT Interface</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    font-family: monospace;
}

#container {
    position: absolute;
    width: 100%;
    height: 100%;
}

#eye-wrapper {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 30vmin;
}

svg {
    width: 100%;
}

#console {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    padding: 16px;
    border: 2px solid #ff2b2b;
    color: #ff2b2b;
    background: rgba(0,0,0,0.85);
    box-shadow: 0 0 15px rgba(255,0,0,0.4);
    font-size: 14px;
}

#console::before {
    content: "OSINT QUERY TERMINAL";
    display: block;
    margin-bottom: 8px;
    opacity: 0.8;
}
</style>
</head>
<body>

<div id="container">

<div id="eye-wrapper">
<svg id="eyeSVG" viewBox="0 0 600 300">
<defs>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="8" result="b1"/>
        <feGaussianBlur stdDeviation="20" result="b2"/>
        <feMerge>
            <feMergeNode in="b2"/>
            <feMergeNode in="b1"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter id="fog">
        <feGaussianBlur stdDeviation="25"/>
    </filter>
</defs>

<g filter="url(#bloom)">
    <path d="M60 150 Q300 70 540 150"
          fill="none" stroke="white"
          stroke-width="10"
          stroke-linecap="round"/>
    <path d="M60 150 Q300 230 540 150"
          fill="none" stroke="white"
          stroke-width="10"
          stroke-linecap="round"/>
</g>

<circle cx="300" cy="150" r="70"
        fill="white" opacity="0.18"
        filter="url(#fog)"/>

<path d="M285 185
         Q260 215 280 245
         Q300 270 295 295"
      fill="none"
      stroke="white"
      stroke-width="6"
      filter="url(#bloom)"
      stroke-linecap="round"/>

<circle id="pupil" cx="300" cy="150" r="14"
        fill="white"
        filter="url(#bloom)"/>
</svg>
</div>

<div id="console">
> Awaiting target input...<br>
> Passive data collection enabled.<br>
> No active trace detected.
</div>

</div>

<script>
const pupil = document.getElementById("pupil");
const svg = document.getElementById("eyeSVG");

const center = { x: 300, y: 150 };
const maxOffset = 22;

document.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (600 / rect.width);
    const my = (e.clientY - rect.top) * (300 / rect.height);

    let dx = mx - center.x;
    let dy = my - center.y;

    const dist = Math.hypot(dx, dy);
    if (dist > maxOffset) {
        dx = dx / dist * maxOffset;
        dy = dy / dist * maxOffset;
    }

    pupil.setAttribute("cx", center.x + dx);
    pupil.setAttribute("cy", center.y + dy);
});
</script>

</body>
</html>
