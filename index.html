<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpyWithMyLittleEye - Watching You</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000; /* Dark background like GD levels */
            overflow: hidden;
            cursor: none; /* Hide default cursor for immersion */
        }

        .eye-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        .eyeball {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5),
                        inset 0 0 100px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Red/blood veins */
        .veins {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, red 2px, transparent 3px),
                radial-gradient(circle at 80% 20%, red 3px, transparent 4px),
                radial-gradient(circle at 30% 70%, red 2px, transparent 3px),
                radial-gradient(circle at 70% 80%, red 3px, transparent 4px),
                radial-gradient(circle at 50% 50%, red 1px, transparent 2px);
            opacity: 0.6;
        }

        .iris {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #00aaff, #0066cc);
            border-radius: 50%;
            top: 100px;
            left: 100px;
            transition: transform 0.1s ease-out;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .pupil {
            position: absolute;
            width: 80px;
            height: 80px;
            background: black;
            border-radius: 50%;
            top: 60px;
            left: 60px;
            box-shadow: 0 0 20px rgba(0, 0, 255, 0.8);
        }

        .glare {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            top: 30px;
            left: 30px;
            opacity: 0.7;
        }

        h1 {
            position: absolute;
            top: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 2em;
            text-shadow: 0 0 10px cyan;
        }
    </style>
</head>
<body>
    <h1>I Spy With My Little Eye...</h1>
    <div class="eye-container" id="eyeContainer">
        <div class="eyeball">
            <div class="veins"></div>
            <div class="iris" id="iris">
                <div class="pupil">
                    <div class="glare"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const eyeContainer = document.getElementById('eyeContainer');
        const iris = document.getElementById('iris');

        document.addEventListener('mousemove', (e) => {
            const rect = eyeContainer.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;

            const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
            const distance = Math.min(60, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 10); // Limit how far it moves

            const offsetX = Math.cos(angle) * distance;
            const offsetY = Math.sin(angle) * distance;

            iris.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });
    </script>
</body>
</html>
