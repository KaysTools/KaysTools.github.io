<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eye</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* mouse */
const mouse = { x: w / 2, y: h / 2 };
window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

/* draw eye */
function drawEye() {
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  const eyeWidth = 420;
  const eyeHeight = 110;
  const circleR = 90; // BIG inner circle

  /* === main eye outline === */
  ctx.save();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 4;
  ctx.shadowBlur = 28;
  ctx.shadowColor = "rgba(255,255,255,0.85)";
  ctx.beginPath();
  ctx.moveTo(cx - eyeWidth / 2, cy);
  ctx.quadraticCurveTo(cx, cy - eyeHeight, cx + eyeWidth / 2, cy);
  ctx.quadraticCurveTo(cx, cy + eyeHeight, cx - eyeWidth / 2, cy);
  ctx.stroke();
  ctx.restore();

  /* === upper floating arc === */
  ctx.save();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 22;
  ctx.shadowColor = "rgba(255,255,255,0.7)";
  ctx.beginPath();
  ctx.moveTo(cx - eyeWidth / 2 + 40, cy - eyeHeight - 20);
  ctx.quadraticCurveTo(
    cx,
    cy - eyeHeight - 45,
    cx + eyeWidth / 2 - 40,
    cy - eyeHeight - 20
  );
  ctx.stroke();
  ctx.restore();

  /* === central circle === */
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, circleR, 0, Math.PI * 2);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 4;
  ctx.shadowBlur = 26;
  ctx.shadowColor = "rgba(255,255,255,0.85)";
  ctx.stroke();
  ctx.restore();

  /* === pupil movement (very subtle) === */
  const dx = mouse.x - cx;
  const dy = mouse.y - cy;
  const d = Math.hypot(dx, dy);
  const maxOffset = 14;

  const px = cx + (dx / (d || 1)) * Math.min(d, maxOffset);
  const py = cy + (dy / (d || 1)) * Math.min(d, maxOffset);

  /* === bright inner orb === */
  ctx.save();
  ctx.beginPath();
  ctx.arc(px, py, 26, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.shadowBlur = 30;
  ctx.shadowColor = "rgba(255,255,255,1)";
  ctx.fill();
  ctx.restore();

  /* === tear curve === */
  ctx.save();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 22;
  ctx.shadowColor = "rgba(255,255,255,0.75)";
  ctx.beginPath();
  ctx.moveTo(cx + 10, cy + circleR - 10);
  ctx.bezierCurveTo(
    cx + 40, cy + circleR + 40,
    cx - 20, cy + circleR + 80,
    cx + 8, cy + circleR + 115
  );
  ctx.stroke();
  ctx.restore();
}

/* animate */
function animate() {
  drawEye();
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
