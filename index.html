<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }

        /* Subtle dark red particles + faint glows */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 30% 70%, rgba(120, 0, 0, 0.12) 0%, transparent 25%),
                radial-gradient(circle at 70% 30%, rgba(140, 0, 0, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(100, 0, 0, 0.08) 0%, transparent 35%);
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(180, 20, 40, 0.4) 1px, transparent 1px);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            opacity: 0.06;
            animation: drift 60s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes drift {
            0% { background-position: 0 0, 40px 40px; }
            100% { background-position: 80px 80px, 120px 120px; }
        }

        /* Title section */
        .header {
            text-align: center;
            margin-top: 80px;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 4.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #b0b0b0;
            margin: 16px 0 8px;
            max-width: 800px;
        }

        .trust {
            font-size: 1rem;
            color: #888888;
            margin-top: 0;
        }

        /* Curved glowing lines behind the eye */
        .lines {
            position: absolute;
            width: 800px;
            height: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(200, 30, 50, 0.6), transparent);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(200, 30, 50, 0.8);
            animation: glow 8s ease-in-out infinite alternate;
        }

        .line:nth-child(1) {
            top: 100px;
            transform: rotate(-15deg) scaleX(1.2);
        }

        .line:nth-child(2) {
            top: 180px;
            transform: rotate(15deg) scaleX(1.2);
        }

        @keyframes glow {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* Eye container */
        .eye-wrapper {
            position: relative;
            z-index: 2;
            margin: 60px 0 40px;
        }

        .eye-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .eyeball {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.6),
                        inset 0 0 80px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .iris {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #b82828, #842424);
            border-radius: 50%;
            top: 70px;
            left: 70px;
            transition: transform 0.1s ease-out;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
        }

        .pupil {
            position: absolute;
            width: 56px;
            height: 56px;
            background: black;
            border-radius: 50%;
            top: 42px;
            left: 42px;
            box-shadow: 0 0 25px rgba(150, 36, 36, 1);
        }

        .glare {
            position: absolute;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            top: 18px;
            left: 18px;
            opacity: 0.8;
        }

        /* Search container - glassmorphism with red-purple tint */
        .search-container {
            width: 90%;
            max-width: 1100px;
            margin-bottom: 80px;
            z-index: 2;
            background: rgba(25, 8, 15, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid rgba(180, 30, 50, 0.3);
            padding: 48px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7),
                        inset 0 0 50px rgba(100, 10, 20, 0.15);
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 12px 32px;
            font-size: 1.1rem;
            background: rgba(40, 10, 20, 0.5);
            color: #d0d0d0;
            border: 1px solid rgba(200, 40, 60, 0.4);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .option-btn:hover {
            background: rgba(80, 20, 40, 0.7);
        }

        .option-btn.active {
            background: rgba(180, 30, 50, 0.8);
            color: #ffffff;
            border-color: #e04050;
            box-shadow: 0 0 25px rgba(220, 50, 70, 0.5);
        }

        .search-input-area {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 380px;
            padding: 22px 32px;
            background: rgba(20, 5, 10, 0.6);
            border: 1px solid rgba(200, 40, 60, 0.5);
            border-radius: 18px;
            color: #ffffff;
            font-size: 1.4rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #e04050;
            box-shadow: 0 0 30px rgba(220, 50, 70, 0.4);
            background: rgba(30, 10, 15, 0.7);
        }

        input[type="text"]::placeholder {
            color: #909090;
        }

        .go-btn {
            padding: 22px 52px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #c03040, #901020);
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(180, 40, 60, 0.5);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .go-btn:hover {
            background: linear-gradient(135deg, #e04050, #b02030);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(220, 50, 70, 0.6);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 36px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            color: #b0b0b0;
        }

        .feature-icon {
            font-size: 1.3rem;
            color: #e05060;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>iSpy</h1>
        <p class="subtitle">Correlate digital identities, infrastructure clues, and online footprints without leaving a trace.</p>
        <p class="trust">Advanced reconnaissance tool trusted by investigators and security teams worldwide.</p>
    </div>

    <div class="lines">
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <div class="eye-wrapper">
        <div class="eye-container" id="eyeContainer">
            <div class="eyeball">
                <div class="iris" id="iris">
                    <div class="pupil">
                        <div class="glare"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="search-container">
        <div class="options">
            <button class="option-btn active">Discord ID</button>
            <button class="option-btn">Username</button>
            <button class="option-btn">IP Lookup</button>
            <button class="option-btn">Website</button>
            <button class="option-btn">User on Site</button>
        </div>

        <div class="search-input-area">
            <input type="text" id="searchInput" placeholder="e.g. domain: example.org">
            <button class="go-btn">Search →</button>
        </div>

        <div class="features">
            <div class="feature"><span class="feature-icon">⚡</span> Automated</div>
            <div class="feature"><span class="feature-icon">🔍</span> Manual</div>
            <div class="feature"><span class="feature-icon">📑</span> Bulk Search</div>
            <div class="feature"><span class="feature-icon">🔒</span> Secure Search</div>
            <div class="feature"><span class="feature-icon">🌐</span> 15+ Sources</div>
        </div>
    </div>

    <script>
        // Eye follows cursor
        const eyeContainer = document.getElementById('eyeContainer');
        const iris = document.getElementById('iris');
        document.addEventListener('mousemove', (e) => {
            const rect = eyeContainer.getBoundingClientRect();
            const eyeX = rect.left + rect.width / 2;
            const eyeY = rect.top + rect.height / 2;
            const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
            const distance = Math.min(42, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 10);
            const offsetX = Math.cos(angle) * distance;
            const offsetY = Math.sin(angle) * distance;
            iris.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });

        // Option buttons
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const placeholders = {
                    'Discord ID': 'e.g. 123456789012345678',
                    'Username': 'e.g. winterfox',
                    'IP Lookup': 'e.g. 192.168.1.1',
                    'Website': 'e.g. example.com',
                    'User on Site': 'e.g. reddit.com/u/username'
                };
                document.getElementById('searchInput').placeholder = placeholders[btn.textContent] || 'e.g. domain: example.org';
            });
        });
    </script>
</body>
</html>
