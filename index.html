<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaysTools v1</title>

<style>
:root {
  --bg-main: #050505;
  --bg-card: rgba(18, 6, 6, 0.9);
  --accent: #850000;
  --accent-soft: rgba(133, 0, 0, 0.35);
  --accent-glow: rgba(133, 0, 0, 0.6);
  --text-main: #ffffff;
  --text-muted: #bdaaaa;
  --border-soft: rgba(255,255,255,0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 25% 20%, rgba(133,0,0,0.2), transparent 45%),
    radial-gradient(circle at 75% 80%, rgba(133,0,0,0.15), transparent 45%),
    var(--bg-main);
  color: var(--text-main);
}

/* NAV */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 48px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
}

.logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #a00000, #500000);
  display: grid;
  place-items: center;
  box-shadow: 0 0 18px var(--accent-glow);
}

/* HERO */
main {
  padding: 90px 20px 140px;
  text-align: center;
}

h1 {
  font-size: 46px;
}

.subtitle {
  margin-top: 18px;
  color: var(--text-muted);
}

/* SEARCH CARD */
.search-card {
  max-width: 920px;
  margin: 60px auto 0;
  padding: 28px;
  border-radius: 22px;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  box-shadow: 0 0 60px rgba(133,0,0,0.35);
  position: relative;
  overflow: hidden;
}

.scan-line {
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: scan 4s infinite;
}

@keyframes scan {
  to { left: 100%; }
}

.search-row {
  display: flex;
  gap: 12px;
}

/* DROPDOWN */
.dropdown {
  position: relative;
  width: 160px;
}

.dropdown-selected {
  padding: 14px;
  background: rgba(0,0,0,0.65);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  cursor: pointer;
}

.dropdown-options {
  position: absolute;
  top: 110%;
  left: 0;
  right: 0;
  background: rgba(10,0,0,0.95);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  display: none;
  z-index: 10;
}

.dropdown-options div {
  padding: 12px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
}

.dropdown-options div:hover {
  background: rgba(133,0,0,0.35);
  color: white;
}

.search-row input {
  flex: 1;
  padding: 14px;
  background: rgba(0,0,0,0.65);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  color: white;
}

.search-row button {
  padding: 14px 26px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #a00000, #5a0000);
  color: white;
  cursor: pointer;
  box-shadow: 0 0 28px var(--accent-glow);
}

/* RESULTS */
.results {
  max-width: 920px;
  margin: 40px auto 0;
  display: none;
  text-align: left;
}

.result-card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  margin-bottom: 10px;
}

.safe { background: rgba(0,120,0,0.3); }
.warning { background: rgba(120,80,0,0.3); }
.danger { background: rgba(120,0,0,0.4); }

.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 14px;
}

.result-item {
  font-size: 13px;
  color: var(--text-muted);
}

@media (max-width: 700px) {
  .search-row { flex-direction: column; }
}
</style>

<script>
let searchType = "ip";

function toggleDropdown() {
  const o = document.getElementById("options");
  o.style.display = o.style.display === "block" ? "none" : "block";
}

function selectType(t, label) {
  searchType = t;
  document.getElementById("selected").innerText = label;
  document.getElementById("options").style.display = "none";
}

function runSearch() {
  const q = document.getElementById("query").value.trim();
  if (!q) return;

  const results = document.getElementById("results");
  const content = document.getElementById("resultsContent");
  results.style.display = "block";

  if (searchType === "email" || searchType === "username") {
    content.innerHTML = `
      <div class="result-card">
        <span class="badge danger">Breach Exposure Detected</span>
        <h3>Exposure Summary</h3>
        <div class="result-grid">
          <div class="result-item">Target: ${q}</div>
          <div class="result-item">Breaches Found: 3</div>
          <div class="result-item">Data Types: Emails, Password Hashes</div>
          <div class="result-item">Risk Level: High</div>
        </div>
      </div>`;
  }

  if (searchType === "ip") {
    content.innerHTML = `
      <div class="result-card">
        <span class="badge safe">Infrastructure Intel</span>
        <div class="result-grid">
          <div class="result-item">IP: ${q}</div>
          <div class="result-item">ASN: AS13335</div>
          <div class="result-item">Country: United States</div>
          <div class="result-item">Hosting: Cloud Provider</div>
        </div>
      </div>`;
  }

  if (searchType === "domain") {
    content.innerHTML = `
      <div class="result-card">
        <span class="badge warning">Domain Reputation</span>
        <div class="result-grid">
          <div class="result-item">Domain: ${q}</div>
          <div class="result-item">DNS Records: Active</div>
          <div class="result-item">SSL: Valid</div>
          <div class="result-item">Reputation: Neutral</div>
        </div>
      </div>`;
  }
}

document.addEventListener("click", e => {
  if (!e.target.closest(".dropdown")) {
    document.getElementById("options").style.display = "none";
  }
});
</script>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <span>KAYTOOLS</span>
  </div>
</header>

<main>
  <h1>Investigate Digital Footprints</h1>
  <p class="subtitle">Public intelligence and exposure correlation</p>

  <section class="search-card">
    <div class="scan-line"></div>
    <div class="search-row">
      <div class="dropdown">
        <div class="dropdown-selected" id="selected" onclick="toggleDropdown()">IP Address</div>
        <div class="dropdown-options" id="options">
          <div onclick="selectType('ip','IP Address')">IP Address</div>
          <div onclick="selectType('domain','Domain')">Domain</div>
          <div onclick="selectType('email','Email')">Email</div>
          <div onclick="selectType('username','Username')">Username</div>
        </div>
      </div>

      <input id="query" placeholder="Enter target..." />
      <button onclick="runSearch()">Search</button>
    </div>
  </section>

  <section class="results" id="results">
    <div id="resultsContent"></div>
  </section>
</main>

</body>
</html>
