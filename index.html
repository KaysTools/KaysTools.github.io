<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAYTOOLS — OSINT Platform</title>

<style>
/* =======================
   ROOT VARIABLES
======================= */
:root {
  --bg-main: #050505;
  --bg-card: rgba(20, 5, 5, 0.85);
  --accent: #850000;
  --accent-soft: rgba(133, 0, 0, 0.35);
  --accent-glow: rgba(133, 0, 0, 0.75);
  --text-main: #ffffff;
  --text-muted: #c9b1b1;
  --border-soft: rgba(255,255,255,0.08);
}

/* =======================
   RESET
======================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(133,0,0,0.18), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(133,0,0,0.15), transparent 45%),
    var(--bg-main);
  color: var(--text-main);
}

/* =======================
   NAVBAR
======================= */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 48px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
  letter-spacing: 0.6px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #a00000, #500000);
  display: grid;
  place-items: center;
  box-shadow: 0 0 18px var(--accent-glow);
}

nav a {
  margin: 0 18px;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 14px;
}

nav a:hover {
  color: var(--text-main);
}

/* =======================
   HERO
======================= */
main {
  text-align: center;
  padding: 90px 20px 120px;
}

h1 {
  font-size: 48px;
  font-weight: 600;
  max-width: 900px;
  margin: 0 auto;
  line-height: 1.15;
}

.subtitle {
  margin-top: 20px;
  font-size: 16px;
  max-width: 720px;
  margin-left: auto;
  margin-right: auto;
  color: var(--text-muted);
}

/* =======================
   CENTER ORB
======================= */
.hero-orb {
  margin: 60px auto 40px;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background: radial-gradient(circle, #a00000, #3a0000);
  display: grid;
  place-items: center;
  box-shadow:
    0 0 45px var(--accent-glow),
    inset 0 0 18px rgba(255,255,255,0.15);
  font-size: 28px;
}

/* =======================
   SEARCH CARD
======================= */
.search-card {
  max-width: 880px;
  margin: 0 auto;
  padding: 28px;
  border-radius: 22px;
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-soft);
  box-shadow:
    0 0 60px rgba(133,0,0,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.04);
}

/* Search input */
.search-input {
  display: flex;
  gap: 14px;
}

.search-input input {
  flex: 1;
  background: rgba(0,0,0,0.55);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  padding: 18px;
  font-size: 15px;
  color: white;
  outline: none;
}

.search-input input::placeholder {
  color: #9f7a7a;
}

.search-input button {
  padding: 18px 28px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #a00000, #5a0000);
  color: white;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 0 30px var(--accent-glow);
  transition: all 0.2s ease;
}

.search-input button:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 45px rgba(133,0,0,0.9);
}

/* =======================
   OPTIONS
======================= */
.search-options {
  margin-top: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.mode button {
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  margin-right: 6px;
}

.mode .active {
  background: rgba(133,0,0,0.35);
  color: white;
  box-shadow: inset 0 0 0 1px rgba(133,0,0,0.7);
}

.features span {
  font-size: 13px;
  color: var(--text-muted);
  margin-left: 18px;
}

/* =======================
   MOBILE
======================= */
@media (max-width: 700px) {
  header {
    padding: 18px 24px;
  }

  h1 {
    font-size: 34px;
  }

  .search-input {
    flex-direction: column;
  }

  .search-input button {
    width: 100%;
  }

  .search-options {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <span>KAYTOOLS</span>
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Pricing</a>
    <a href="#">API</a>
  </nav>

  <div></div>
</header>

<main>
  <h1>Investigate Digital Footprints</h1>

  <p class="subtitle">
    Correlate public intelligence, infrastructure signals, and identity traces
    from a single unified OSINT interface.
  </p>

  <div class="hero-orb">⬢</div>

  <section class="search-card">
    <div class="search-input">
      <input type="text" placeholder="IP, domain, email, username…" />
      <button>Search →</button>
    </div>

    <div class="search-options">
      <div class="mode">
        <button class="active">Automated</button>
        <button>Manual</button>
      </div>

      <div class="features">
        <span>Bulk Search</span>
        <span>Secure Mode</span>
        <span>15+ Sources</span>
      </div>
    </div>
  </section>
</main>

</body>
</html>
