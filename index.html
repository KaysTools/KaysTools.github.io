<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaysTools v1</title>

<style>
:root {
  --bg-main: #050505;
  --bg-card: rgba(20, 5, 5, 0.88);
  --accent: #850000;
  --accent-soft: rgba(133, 0, 0, 0.35);
  --accent-glow: rgba(133, 0, 0, 0.75);
  --text-main: #ffffff;
  --text-muted: #c9b1b1;
  --border-soft: rgba(255,255,255,0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(133,0,0,0.18), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(133,0,0,0.15), transparent 45%),
    var(--bg-main);
  color: var(--text-main);
}

/* NAV */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 48px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
}

.logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #a00000, #500000);
  display: grid;
  place-items: center;
  box-shadow: 0 0 18px var(--accent-glow);
}

nav a {
  margin: 0 18px;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 14px;
}

/* HERO */
main {
  padding: 90px 20px 120px;
  text-align: center;
}

h1 {
  font-size: 48px;
}

.subtitle {
  margin-top: 18px;
  color: var(--text-muted);
}

/* ORB */
.hero-orb {
  margin: 60px auto 40px;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background: radial-gradient(circle, #a00000, #3a0000);
  display: grid;
  place-items: center;
  box-shadow: 0 0 45px var(--accent-glow);
}

/* SEARCH CARD */
.search-card {
  max-width: 900px;
  margin: 0 auto;
  padding: 26px;
  border-radius: 22px;
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-soft);
  box-shadow: 0 0 60px rgba(133,0,0,0.35);
}

.search-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* CUSTOM DROPDOWN */
.dropdown {
  position: relative;
  width: 160px;
}

.dropdown-selected {
  padding: 14px;
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  cursor: pointer;
  font-size: 14px;
}

.dropdown-options {
  position: absolute;
  top: 110%;
  left: 0;
  right: 0;
  background: rgba(10,0,0,0.95);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  display: none;
  overflow: hidden;
  z-index: 10;
}

.dropdown-options div {
  padding: 12px 14px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-muted);
}

.dropdown-options div:hover {
  background: rgba(133,0,0,0.35);
  color: white;
}

/* INPUT */
.search-row input {
  flex: 1;
  padding: 14px;
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  color: white;
  font-size: 14px;
}

/* BUTTON */
.search-row button {
  padding: 14px 26px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #a00000, #5a0000);
  color: white;
  cursor: pointer;
  box-shadow: 0 0 30px var(--accent-glow);
}

/* MOBILE */
@media (max-width: 700px) {
  .search-row {
    flex-direction: column;
  }
}
</style>

<script>
let searchType = "ip";

function toggleDropdown() {
  const box = document.getElementById("options");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function selectType(type, label) {
  searchType = type;
  document.getElementById("selected").innerText = label;
  document.getElementById("options").style.display = "none";
}

function runSearch() {
  const q = document.getElementById("query").value.trim();
  if (!q) return;

  let url = "";
  if (searchType === "ip") url = "https://www.shodan.io/search?query=" + encodeURIComponent(q);
  if (searchType === "domain") url = "https://www.virustotal.com/gui/domain/" + encodeURIComponent(q);
  if (searchType === "email") url = "https://haveibeenpwned.com/unifiedsearch/" + encodeURIComponent(q);
  if (searchType === "username") url = "https://namechk.com/";

  window.open(url, "_blank");
}

document.addEventListener("click", e => {
  if (!e.target.closest(".dropdown")) {
    document.getElementById("options").style.display = "none";
  }
});
</script>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <span>KAYTOOLS</span>
  </div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Modules</a>
    <a href="#">API</a>
  </nav>
</header>

<main>
  <h1>Investigate Digital Footprints</h1>
  <p class="subtitle">OSINT using public data only</p>

  <div class="hero-orb">⬢</div>

  <section class="search-card">
    <div class="search-row">
      
      <div class="dropdown">
        <div class="dropdown-selected" id="selected" onclick="toggleDropdown()">IP Address</div>
        <div class="dropdown-options" id="options">
          <div onclick="selectType('ip','IP Address')">IP Address</div>
          <div onclick="selectType('domain','Domain')">Domain</div>
          <div onclick="selectType('email','Email')">Email</div>
          <div onclick="selectType('username','Username')">Username</div>
        </div>
      </div>

      <input id="query" placeholder="Enter target…" />
      <button onclick="runSearch()">Search →</button>

    </div>
  </section>
</main>

</body>
</html>
