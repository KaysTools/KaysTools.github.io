<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAYTOOLS – OSINT Dashboard</title>

  <style>
    :root {
      --bg-main: #060607;
      --bg-card: rgba(20, 10, 10, 0.65);
      --accent: #850000;
      --accent-glow: rgba(133, 0, 0, 0.65);
      --text-main: #ffffff;
      --text-muted: #c7b6b6;
      --border-soft: rgba(255,255,255,0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 20%, rgba(133,0,0,0.15), transparent 40%),
        radial-gradient(circle at 70% 80%, rgba(133,0,0,0.12), transparent 45%),
        var(--bg-main);
      color: var(--text-main);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 48px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #a00000, #550000);
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    nav a {
      margin: 0 16px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 14px;
    }

    nav a:hover {
      color: var(--text-main);
    }

    main {
      text-align: center;
      padding: 90px 20px 0;
    }

    h1 {
      font-size: 46px;
      font-weight: 600;
      max-width: 900px;
      margin: 0 auto;
    }

    .subtitle {
      margin-top: 18px;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
      font-size: 16px;
      color: var(--text-muted);
    }

    .hero-icon {
      margin: 55px auto 35px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle, #a00000, #400000);
      display: grid;
      place-items: center;
      box-shadow: 0 0 35px var(--accent-glow);
    }

    .search-card {
      max-width: 860px;
      margin: 0 auto;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 26px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 0 55px rgba(133,0,0,0.25);
    }

    .search-input {
      display: flex;
      gap: 14px;
    }

    .search-input input {
      flex: 1;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 16px 18px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .search-input input::placeholder {
      color: #9b7d7d;
    }

    .search-input button {
      padding: 16px 26px;
      border-radius: 14px;
      border: none;
