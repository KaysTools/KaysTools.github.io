<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neon Eye - Detailed Original</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        cursor: none;
    }
    svg {
        width: 70vmin;
        height: auto;
    }
    /* Subtle neon glow - only very light */
    .neon {
        stroke: white;
        fill: none;
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(255,255,255,0.4))
                drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }
    .pupil {
        fill: white;
        filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));
    }
</style>
</head>
<body>
<svg id="eye" viewBox="0 0 400 200">
    <!-- Upper eyelid - elegant asymmetric curve -->
    <path class="neon" stroke-width="5" d="M50 100 Q120 40, 200 60 Q280 40, 350 100" />
    
    <!-- Lower eyelid - softer curve -->
    <path class="neon" stroke-width="5" d="M50 100 Q140 150, 200 130 Q260 150, 350 100" />
    
    <!-- Sclera outline (white part) - very subtle inner line -->
    <ellipse class="neon" stroke-width="3" cx="200" cy="100" rx="110" ry="70" />
    
    <!-- Iris - detailed concentric rings -->
    <circle class="neon" stroke-width="4" cx="200" cy="100" r="55" />
    <circle class="neon" stroke-width="2" cx="200" cy="100" r="45" />
    <circle class="neon" stroke-width="3" cx="200" cy="100" r="35" />
    
    <!-- Pupil - follows mouse -->
    <circle id="pupil" class="pupil" cx="200" cy="100" r="18" />
    
    <!-- Highlight in pupil for life-like effect -->
    <circle fill="white" opacity="0.8" cx="208" cy="92" r="6" />
    <circle fill="white" opacity="0.4" cx="195" cy="105" r="4" />
    
    <!-- Lower lash line - delicate lashes -->
    <path class="neon" stroke-width="2" d="M100 110 Q120 125 140 118" />
    <path class="neon" stroke-width="2" d="M150 120 Q170 135 190 125" />
    <path class="neon" stroke-width="2" d="M210 122 Q230 137 250 127" />
    <path class="neon" stroke-width="2" d="M260 118 Q280 130 300 120" />
    
    <!-- Upper subtle crease -->
    <path class="neon" stroke-width="2" opacity="0.6" d="M80 70 Q200 50 320 70" />
    
    <!-- Single elegant tear -->
    <path class="neon" stroke-width="4" d="M160 115 Q145 140 155 170" />
    <circle class="neon" stroke-width="3" fill="none" cx="155" cy="175" r="8" />
</svg>

<script>
const pupil = document.getElementById("pupil");
const eye = document.getElementById("eye");
const eyeCenter = { x: 200, y: 100 };
const maxOffset = 25; // Room to move inside the iris

document.addEventListener("mousemove", (e) => {
    const rect = eye.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    const scaleX = 400 / rect.width;
    const scaleY = 200 / rect.height;
    const svgX = mouseX * scaleX;
    const svgY = mouseY * scaleY;
    
    let dx = svgX - eyeCenter.x;
    let dy = svgY - eyeCenter.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance > maxOffset) {
        dx = (dx / distance) * maxOffset;
        dy = (dy / distance) * maxOffset;
    }
    
    pupil.setAttribute("cx", eyeCenter.x + dx);
    pupil.setAttribute("cy", eyeCenter.y + dy);
});
</script>
</body>
</html>
